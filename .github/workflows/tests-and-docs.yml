          echo "VERILATOR_ROOT=$HOME/verilator-install/share/verilator" >> $GITHUB_ENV

      - name: Setup Python environment (pyenv + dependencies)
        run: ./install.sh

      - name: Configure RTL and run test
        id: run-test
        env:
